name: Deploy VPN Bot

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Connect to server and update
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}

          script: |
            cd /root/VPN
            
            # 1. Настраиваем чистый URL (на случай если там застрял старый токен)
            git remote set-url origin https://github.com/BadiBay/GuepardVPN.git
            
            # 2. Передаем токен через заголовок (самый стабильный метод)
            # Мы кодируем токен в base64 и передаем его в конфиг на время сессии
            git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $(echo -n x-access-token:${{ secrets.GH_TOKEN }} | base64)"
            
            # 3. Обновляем код
            git fetch origin main
            git reset --hard origin/main
            
            # 4. Очищаем заголовок после использования (безопасность)
            git config --local --unset http.https://github.com/.extraheader
            
            # 5. Перезапуск контейнеров
            docker compose up -d --build --remove-orphans
name: Deploy VPN Bot

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Connect to server and update
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}

          script: |
            cd /root/VPN
            
            # 1. Используем наш новый личный токен
            git remote set-url origin https://${{ github.actor }}:${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}.git
            
            # 2. Качаем код И (&&) запускаем Докер ТОЛЬКО если скачивание прошло без ошибок
            git pull origin main && docker compose up -d --build --remove-orphans
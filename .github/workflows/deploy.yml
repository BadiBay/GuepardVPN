name: Deploy VPN Bot

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Connect to server and update
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}

          script: |
            cd /root/VPN
            
            # Скачиваем код напрямую по защищенной ссылке, минуя настройки сервера
            git pull https://${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}.git main
            
            # Если скачалось успешно - пересобираем Докер
            docker compose up -d --build --remove-orphans
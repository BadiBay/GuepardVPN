name: Deploy VPN Bot

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Connect to server and update
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}

          script: |
            cd /root/VPN
            
            # 1. Привязываем новую ссылку с вашим новым токеном
            git remote set-url origin https://${{ github.actor }}:${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}.git
            
            # 2. Очищаем любые кэши паролей Git на сервере (чтобы они не мешали)
            git config --system --unset credential.helper || true
            git config --global --unset credential.helper || true
            
            # 3. Жестко скачиваем свежий код и заменяем им файлы на сервере
            git fetch origin
            git reset --hard origin/main
            
            # 4. Пересобираем Докер
            docker compose up -d --build --remove-orphans